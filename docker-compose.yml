services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guitstrum
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: guit_strum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  recognizer:
    build: ../guitstrum-recognizer
    ports:
      - "8000:8000"

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://guitstrum:localdevpassword@postgres:5432/guit_strum?schema=public
    depends_on:
      - postgres
      - recognizer

volumes:
  pgdata:
